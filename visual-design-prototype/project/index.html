<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Light Matters — Look & Feel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; }
    body { font-family: 'EB Garamond', 'Iowan Old Style', serif; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
    * { box-sizing: border-box; }

    @keyframes lmBlink { 50% { opacity: 0; } }

    /* Spacetime vector animations — used by the diagram primitive */
    @keyframes lmVectorSwing {
      0%, 12% { transform: rotate(0deg); }
      44%, 56% { transform: rotate(-62deg); }
      88%, 100% { transform: rotate(0deg); }
    }
    @keyframes lmVectorA {
      0%, 12%  { transform: rotate(-15deg); }
      44%, 56% { transform: rotate(-55deg); }
      88%, 100% { transform: rotate(-15deg); }
    }
    @keyframes lmVectorB {
      0%, 12%  { transform: rotate(-45deg); }
      44%, 56% { transform: rotate(-8deg);  }
      88%, 100% { transform: rotate(-45deg); }
    }
    @keyframes lmWave {
      0%   { r: 4;   opacity: 0;   stroke-opacity: 0; }
      8%   { opacity: 1;   stroke-opacity: 0.9; }
      100% { r: 130; opacity: 0;   stroke-opacity: 0; }
    }
    @keyframes lmEmit {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2px); }
    }
    @keyframes lmDot {
      0%, 12%, 88%, 100% { transform: translate(0, 0); }
      44%, 56%           { transform: translate(216px, -114px); }
    }
    @keyframes lmConeFall {
      0%, 8% { opacity: 0; }
      10%    { opacity: 1; }
      95%    { opacity: 1; }
      100%   { opacity: 0; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="theme.jsx"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="brand-sheet.jsx"></script>
  <script type="text/babel" src="landing.jsx"></script>
  <script type="text/babel" src="chapter-index.jsx"></script>
  <script type="text/babel" src="step-ui.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
